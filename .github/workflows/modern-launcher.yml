name: Modern launcher build
on:
  push:
    branches: ["revival/mcpe-1.21.132.1"]
    paths: ["modern-launcher/**", "build.gradle", "settings.gradle", ".github/workflows/modern-launcher.yml"]
  pull_request:
    paths: ["modern-launcher/**", "build.gradle", "settings.gradle", ".github/workflows/modern-launcher.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and native build components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$ANDROID_HOME/cmake/3.22.1"
      - name: Assemble modern launcher
        run: gradle --no-daemon :modern-launcher:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nex-launcher-debug
          path: modern-launcher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
